[workspace]
members = [
    "crates/provider-contract",
    "crates/provider-execution",
    "crates/provider-memory",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
repository = "https://github.com/nestharus/agent-provider-sdk"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
jsonschema = { version = "=0.46.5", default-features = false }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
